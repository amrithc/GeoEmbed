name: geoembded
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip

  # PyTorch — conda-forge has Apple Silicon (MPS) builds
  - pytorch>=2.1.0
  - torchvision>=0.16.0

  # Data & ML
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scikit-learn>=1.3.0
  - pillow>=10.0.0
  - tqdm>=4.66.0
  - matplotlib>=3.7.0
  - zarr>=2.16.0

  # App
  - streamlit>=1.28.0

  # faiss from conda-forge shares OpenMP with PyTorch — avoids macOS libomp conflict
  - faiss-cpu>=1.7.4

  # pip-only packages
  - pip:
    - transformers>=4.35.0
